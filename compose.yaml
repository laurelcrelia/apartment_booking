x-rabbitmq-url: &rabbitmq-url amqp://booking:booking@rabbitmq:5672/

services:
  # Message broker for events between services. Management UI:
  # http://localhost:15672 (user and password: booking).
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: booking
      RABBITMQ_DEFAULT_PASS: booking
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Apartments service: internal only (no published port), with its own database.
  apartments:
    build: .
    image: apartment-booking
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "4",
              "--access-logfile", "-", "apartments_service.app:create_app()"]
    volumes:
      - apartments-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Publishes the apartments service's outbox events to RabbitMQ.
  apartments-relay:
    build: .
    image: apartment-booking
    command: ["python", "-m", "apartments_service.relay"]
    environment:
      RABBITMQ_URL: *rabbitmq-url
    volumes:
      - apartments-data:/data
    depends_on:
      apartments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Keeps the apartments replica in bookings.db up to date from those events.
  booking-consumer:
    build: .
    image: apartment-booking
    command: ["python", "-m", "apartment_booking.consumer"]
    environment:
      RABBITMQ_URL: *rabbitmq-url
    volumes:
      - booking-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Web UI, public REST API and bookings; calls the apartments service over HTTP.
  web:
    build: .
    image: apartment-booking
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APARTMENTS_URL: http://apartments:8000
    volumes:
      - booking-data:/data
    depends_on:
      apartments:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Command-line interface, sharing the web app's data volume and apartments service:
  #   docker compose run --rm booking apartment list
  booking:
    build: .
    image: apartment-booking
    entrypoint: ["python", "booking.py"]
    command: ["--help"]
    environment:
      APARTMENTS_URL: http://apartments:8000
    volumes:
      - booking-data:/data
    depends_on:
      apartments:
        condition: service_healthy
    profiles: ["cli"]

  tests:
    build:
      context: .
      target: test
    image: apartment-booking:test
    profiles: ["test"]

volumes:
  # Names are overridable so CI on a developer machine never touches the real data.
  booking-data:
    name: ${BOOKING_VOLUME:-booking-data}
  apartments-data:
    name: ${APARTMENTS_VOLUME:-apartments-data}
  rabbitmq-data:
    name: ${RABBITMQ_VOLUME:-rabbitmq-data}
