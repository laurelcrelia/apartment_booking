# Credentials come from the environment or a git-ignored .env file next to this
# file (see .env.example); nothing secret is stored in the repository. Compose
# refuses to start without RABBITMQ_PASSWORD.
x-rabbitmq-url: &rabbitmq-url "amqp://${RABBITMQ_USER:-booking}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env, see .env.example}@rabbitmq:5672/"

services:
  # Message broker for events between services. Management UI:
  # http://localhost:15672 (log in with RABBITMQ_USER and RABBITMQ_PASSWORD).
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      # Only used when the rabbitmq-data volume is first created.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-booking}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env, see .env.example}
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Apartments service: internal only (no published port), with its own database.
  apartments:
    build: .
    image: apartment-booking
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "4",
              "--access-logfile", "-", "apartments_service.app:create_app()"]
    volumes:
      - apartments-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Apartments worker: publishes apartment events (outbox relay) and keeps the
  # apartments service's bookings replica up to date from booking events.
  apartments-worker:
    build: .
    image: apartment-booking
    command: ["python", "-m", "apartments_service.worker"]
    environment:
      RABBITMQ_URL: *rabbitmq-url
    volumes:
      - apartments-data:/data
    depends_on:
      apartments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:  # healthy while both its relay and its consumer are connected and working
      test: ["CMD", "python", "-m", "common.health",
             "/tmp/apartments-relay.heartbeat", "/tmp/apartments-consumer.heartbeat"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Booking worker: publishes booking events (outbox relay) and keeps the
  # booking side's apartments replica up to date from apartment events.
  bookings-worker:
    build: .
    image: apartment-booking
    command: ["python", "-m", "apartment_booking.worker"]
    environment:
      RABBITMQ_URL: *rabbitmq-url
    volumes:
      - booking-data:/data
    depends_on:
      web:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:  # healthy while both its relay and its consumer are connected and working
      test: ["CMD", "python", "-m", "common.health",
             "/tmp/bookings-relay.heartbeat", "/tmp/bookings-consumer.heartbeat"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Gateway: the only way in from outside. Passes requests to `web` for now.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:  # the gateway itself, independent of the services behind it
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Web UI, public REST API and bookings; calls the apartments service over HTTP.
  # Internal only: reached through nginx.
  web:
    build: .
    image: apartment-booking
    environment:
      APARTMENTS_URL: http://apartments:8000
      TRUSTED_PROXIES: "1"  # nginx: trust one X-Forwarded-For hop
    volumes:
      - booking-data:/data
    depends_on:
      apartments:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Command-line interface, sharing the web app's data volume and apartments service:
  #   docker compose run --rm booking apartment list
  booking:
    build: .
    image: apartment-booking
    entrypoint: ["python", "booking.py"]
    command: ["--help"]
    environment:
      APARTMENTS_URL: http://apartments:8000
    volumes:
      - booking-data:/data
    depends_on:
      apartments:
        condition: service_healthy
    profiles: ["cli"]

  tests:
    build:
      context: .
      target: test
    image: apartment-booking:test
    profiles: ["test"]

volumes:
  # Names are overridable so CI on a developer machine never touches the real data.
  booking-data:
    name: ${BOOKING_VOLUME:-booking-data}
  apartments-data:
    name: ${APARTMENTS_VOLUME:-apartments-data}
  rabbitmq-data:
    name: ${RABBITMQ_VOLUME:-rabbitmq-data}
