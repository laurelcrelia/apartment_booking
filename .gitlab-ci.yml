# GitLab CI for a self-hosted runner using the shell executor: jobs run
# directly on the runner machine and use its Docker. See README "GitLab CI".

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages: [test, e2e]

default:
  tags: [local-docker]
  interruptible: true

variables:
  # Separate Compose project, data volume and port per job, so CI never
  # touches the app you run yourself on the same machine.
  COMPOSE_PROJECT_NAME: ci-$CI_JOB_ID
  BOOKING_VOLUME: booking-data-ci-$CI_JOB_ID
  APARTMENTS_VOLUME: apartments-data-ci-$CI_JOB_ID
  RABBITMQ_VOLUME: rabbitmq-data-ci-$CI_JOB_ID
  RABBITMQ_UI_PORT: "25672"
  APP_PORT: "18000"

docker-test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  script:
    - docker build --target test --build-arg PYTHON_VERSION=$PYTHON_VERSION -t ci-test:$CI_JOB_ID .
    - docker run --rm ci-test:$CI_JOB_ID
    - docker build --build-arg PYTHON_VERSION=$PYTHON_VERSION -t ci-app:$CI_JOB_ID .
    - docker run --rm --entrypoint python ci-app:$CI_JOB_ID booking.py --help
  after_script:
    - docker image rm -f ci-test:$CI_JOB_ID ci-app:$CI_JOB_ID

coverage:
  stage: test
  script:
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements-dev.txt
    - .venv/bin/coverage run --source=apartment_booking,apartments_service,common -m unittest -v
    - .venv/bin/coverage report -m
    - .venv/bin/coverage xml
    - .venv/bin/coverage html
    - .venv/bin/coverage report --fail-under=90
  coverage: '/^TOTAL.*\s(\d+%)$/'
  artifacts:
    when: always
    paths: [htmlcov/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

api-tests:
  stage: test
  script:
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements.txt
    - .venv/bin/python -m unittest discover -s api_tests -v

playwright:
  stage: e2e
  script:
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements-e2e.txt
    # Chromium is cached in ~/Library/Caches/ms-playwright, so this only downloads once.
    - .venv/bin/python -m playwright install chromium
    - .venv/bin/python -m unittest discover -s e2e -v

compose-e2e:
  stage: e2e
  script:
    # Throwaway RabbitMQ password for this job; after_script reads the same .env.
    - printf 'RABBITMQ_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
    - docker compose up -d --build --wait
    - python3 scripts/smoke_test.py http://localhost:$APP_PORT --keep > smoke.log || { cat smoke.log; exit 1; }
    - cat smoke.log
    - API_BASE_URL=http://localhost:$APP_PORT python3 -m unittest discover -s api_tests -v
    - ID=$(grep KEPT_APARTMENT_ID smoke.log | cut -d= -f2)
    - docker compose down
    - docker compose up -d --wait
    - curl -fsS http://localhost:$APP_PORT/api/apartments/$ID
    # Apartment changes reach the booking side through RabbitMQ, even if the consumer was down.
    - docker compose stop booking-consumer
    - "curl -fsS -X PATCH -H 'Content-Type: application/json' -d '{\"rooms\": 7}' http://localhost:$APP_PORT/api/apartments/$ID"
    - docker compose start booking-consumer
    - |
      for i in $(seq 30); do
        curl -fsS "http://localhost:$APP_PORT/api/apartments?from=2099-12-01&to=2099-12-02&min_rooms=7" \
          | python3 -c "import json, sys; sys.exit(not any(a['id'] == $ID for a in json.load(sys.stdin)))" \
          && break
        [ "$i" = 30 ] && { echo "apartment $ID never showed up in search"; exit 1; }
        sleep 1
      done
    # Apartments service down: 503 for apartments, bookings still work from the replica.
    - docker compose stop apartments
    - test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$APP_PORT/api/apartments)" = 503
    - "curl -fsS -X POST -H 'Content-Type: application/json' -d \"{\\\"apartment_id\\\": $ID, \\\"check_in\\\": \\\"2099-12-10\\\", \\\"check_out\\\": \\\"2099-12-11\\\"}\" http://localhost:$APP_PORT/api/bookings"
    - docker compose start apartments
    - docker compose up -d --wait
    # Only the gateway is published; JSON 503 while the web app is down, and back afterwards.
    - test -z "$(docker compose port web 8000 2>/dev/null)"
    - docker compose stop web
    - test "$(curl -s -o body.json -w '%{http_code}' http://localhost:$APP_PORT/api/apartments)" = 503
    - grep -q '"service_unavailable"' body.json
    - docker compose start web
    - docker compose up -d --wait
    - curl -fsS http://localhost:$APP_PORT/api/apartments > /dev/null
    - docker compose run --rm booking apartment view $ID
    - docker compose --profile test run --rm --build tests
  after_script:
    - docker compose logs
    - docker compose down -v --remove-orphans
