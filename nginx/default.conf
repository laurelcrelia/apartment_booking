# NGINX gateway: the only entry point from outside (see documentation/gateway-plan.md).
#
# /api/apartments goes to the apartments service, the rest of /api to the web
# app (bookings, health, the spec). Everything else is the static frontend in
# frontend/ (mounted at /usr/share/nginx/html): each page URL gets its HTML
# file, whose script loads the data from the API. apartment_booking/local.py
# mirrors these routes for running without Docker; keep the two in sync.

# Docker's internal DNS. Looking the service name up per request (with a
# short cache) keeps the gateway working when a container restarts with a new
# address, and lets NGINX start before the web app is up.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8000;
    server_name _;

    client_max_body_size 1m;
    root /usr/share/nginx/html;

    proxy_http_version 1.1;
    # The services are on the same Docker network: if one doesn't accept the
    # connection within seconds it's down, so answer 503 quickly.
    proxy_connect_timeout 5s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $web http://web:8000;
    set $apartments http://apartments:8000;

    location = /api/apartments {
        proxy_pass $apartments;
        error_page 502 504 = @api_unavailable;
    }

    location /api/apartments/ {
        proxy_pass $apartments;
        error_page 502 504 = @api_unavailable;
    }

    location /api/ {
        proxy_pass $web;
        # Service not reachable: answer in the API's error format. Errors the
        # service sends itself (including its own 503s) pass through unchanged.
        error_page 502 504 = @api_unavailable;
    }

    # Pages: the URL selects the HTML file; the ID is read by the page's script.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/apartments/[0-9]+$ {
        try_files /apartment.html =404;
    }

    location = /bookings {
        try_files /bookings.html =404;
    }

    location ~ ^/bookings/[0-9]+$ {
        try_files /booking.html =404;
    }

    location = /api/docs {
        try_files /api-docs.html =404;
    }

    location /static/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error": {"code": "service_unavailable", "message": "The service is unavailable; try again later"}}\n';
    }
}

# Health check for the gateway itself (used by Docker, not published). It must
# not depend on the services behind it: NGINX stays healthy while one is down,
# and keeps answering for it with 503.
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
