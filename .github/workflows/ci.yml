name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: >
          docker build
          --build-arg PYTHON_VERSION=${{ matrix.python-version }}
          -t apartment-booking:py${{ matrix.python-version }} .

      - name: Run tests in container
        run: >
          docker run --rm --entrypoint python
          apartment-booking:py${{ matrix.python-version }}
          -m unittest -v

      - name: Smoke test CLI
        run: docker run --rm apartment-booking:py${{ matrix.python-version }} --help
