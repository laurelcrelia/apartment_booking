name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: >
          docker build --target test
          --build-arg PYTHON_VERSION=${{ matrix.python-version }}
          -t apartment-booking:test-py${{ matrix.python-version }} .

      - name: Run tests in container
        run: docker run --rm apartment-booking:test-py${{ matrix.python-version }}

      - name: Build runtime image
        run: >
          docker build
          --build-arg PYTHON_VERSION=${{ matrix.python-version }}
          -t apartment-booking:py${{ matrix.python-version }} .

      - name: Smoke test CLI
        run: >
          docker run --rm --entrypoint python
          apartment-booking:py${{ matrix.python-version }} booking.py --help

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: coverage run --source=apartment_booking,apartments_service,common -m unittest -v

      - name: Coverage report
        run: |
          coverage report -m
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Enforce minimum coverage
        run: coverage report --fail-under=90

  api-tests:
    name: HTTP API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests (app in-process)
        run: python -m unittest discover -s api_tests -v

  playwright:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-e2e.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: python -m unittest discover -s e2e -v

  compose:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with a throwaway RabbitMQ password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf 'RABBITMQ_PASSWORD=%s\n' "$password" > .env

      - name: Start app
        run: docker compose up -d --build --wait

      - name: Run workflows against http://localhost:8000
        id: smoke
        run: python3 scripts/smoke_test.py http://localhost:8000 --keep | tee smoke.log && grep KEPT_APARTMENT_ID smoke.log >> "$GITHUB_OUTPUT"

      - name: API tests against the running stack
        run: API_BASE_URL=http://localhost:8000 python3 -m unittest discover -s api_tests -v

      - name: Data survives a restart
        run: |
          docker compose down
          docker compose up -d --wait
          curl -fsS http://localhost:8000/api/apartments/${{ steps.smoke.outputs.KEPT_APARTMENT_ID }}

      - name: Apartment changes reach the booking side through RabbitMQ
        env:
          ID: ${{ steps.smoke.outputs.KEPT_APARTMENT_ID }}
        run: |
          docker compose stop bookings-worker   # events wait in the queue meanwhile
          curl -fsS -X PATCH -H 'Content-Type: application/json' -d '{"rooms": 7}' \
            http://localhost:8000/api/apartments/$ID
          docker compose start bookings-worker
          # The queued event reaches the booking side's apartments replica once the worker is back.
          for i in $(seq 30); do
            docker compose logs bookings-worker | grep -q "applied apartment.updated for apartment $ID " && exit 0
            sleep 1
          done
          echo "apartment $ID's change never reached the booking side"; docker compose logs apartments-worker bookings-worker; exit 1

      - name: Booking events reach the apartments service through RabbitMQ
        env:
          ID: ${{ steps.smoke.outputs.KEPT_APARTMENT_ID }}
        run: |
          BID=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"apartment_id\": $ID, \"check_in\": \"2099-12-20\", \"check_out\": \"2099-12-21\"}" \
            http://localhost:8000/api/bookings | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          for i in $(seq 30); do
            docker compose logs apartments-worker | grep -q "applied booking.created for booking $BID " && exit 0
            sleep 1
          done
          echo "booking $BID never reached the apartments service"; docker compose logs apartments-worker bookings-worker; exit 1

      - name: Apartments service down gives 503, bookings keep working
        env:
          ID: ${{ steps.smoke.outputs.KEPT_APARTMENT_ID }}
        run: |
          docker compose stop apartments
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/apartments)" = 503
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"apartment_id\": $ID, \"check_in\": \"2099-12-10\", \"check_out\": \"2099-12-11\"}" \
            http://localhost:8000/api/bookings
          docker compose start apartments
          docker compose up -d --wait

      - name: Gateway routes by path; with the web app down only its parts fail
        env:
          ID: ${{ steps.smoke.outputs.KEPT_APARTMENT_ID }}
        run: |
          # Compose prints ":0" for a port that isn't published, "host:port" otherwise.
          published=$(docker compose port web 8000 2>/dev/null || true)
          echo "web 8000 -> '$published'"
          if echo "$published" | grep -q ':[1-9]'; then echo "web must not be published"; exit 1; fi
          docker compose stop web
          # /api/apartments goes straight to the apartments service and keeps working.
          curl -fsS --max-time 15 "http://localhost:8000/api/apartments?from=2099-01-01&to=2099-01-02" > /dev/null
          # /api/bookings is the web app's: JSON 503 from nginx, quickly (--max-time).
          test "$(curl -s --max-time 15 -o body.json -w '%{http_code}' http://localhost:8000/api/bookings)" = 503
          grep -q '"service_unavailable"' body.json
          # Deleting needs the booking service for the active-bookings check: 503, apartment kept.
          test "$(curl -s --max-time 15 -o body.json -w '%{http_code}' -X DELETE http://localhost:8000/api/apartments/$ID)" = 503
          grep -q '"service_unavailable"' body.json
          docker compose start web
          docker compose up -d --wait
          curl -fsS http://localhost:8000/api/bookings > /dev/null   # nginx finds the restarted web app
          curl -fsS http://localhost:8000/api/apartments/$ID > /dev/null

      - name: CLI shares the data volume
        run: docker compose run --rm booking apartment view ${{ steps.smoke.outputs.KEPT_APARTMENT_ID }}

      - name: Tests run via Compose
        run: docker compose --profile test run --rm --build tests

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop app
        if: always()
        run: docker compose down -v
