name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: >
          docker build --target test
          --build-arg PYTHON_VERSION=${{ matrix.python-version }}
          -t apartment-booking:test-py${{ matrix.python-version }} .

      - name: Run tests in container
        run: docker run --rm apartment-booking:test-py${{ matrix.python-version }}

      - name: Build runtime image
        run: >
          docker build
          --build-arg PYTHON_VERSION=${{ matrix.python-version }}
          -t apartment-booking:py${{ matrix.python-version }} .

      - name: Smoke test CLI
        run: >
          docker run --rm --entrypoint python
          apartment-booking:py${{ matrix.python-version }} booking.py --help

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: coverage run --source=apartment_booking -m unittest -v

      - name: Coverage report
        run: |
          coverage report -m
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Enforce minimum coverage
        run: coverage report --fail-under=90

  compose:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start app
        run: docker compose up -d --build --wait

      - name: Run workflows against http://localhost:8000
        id: smoke
        run: python3 scripts/smoke_test.py http://localhost:8000 --keep | tee smoke.log && grep KEPT_APARTMENT_ID smoke.log >> "$GITHUB_OUTPUT"

      - name: Data survives a restart
        run: |
          docker compose down
          docker compose up -d --wait
          curl -fsS http://localhost:8000/api/apartments/${{ steps.smoke.outputs.KEPT_APARTMENT_ID }}

      - name: CLI shares the data volume
        run: docker compose run --rm booking apartment view ${{ steps.smoke.outputs.KEPT_APARTMENT_ID }}

      - name: Tests run via Compose
        run: docker compose --profile test run --rm --build tests

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop app
        if: always()
        run: docker compose down -v
