name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    name: Docker tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: >
          docker build
          --build-arg PYTHON_VERSION=${{ matrix.python-version }}
          -t apartment-booking:py${{ matrix.python-version }} .

      - name: Run tests in container
        run: >
          docker run --rm --entrypoint python
          apartment-booking:py${{ matrix.python-version }}
          -m unittest -v

      - name: Smoke test CLI
        run: docker run --rm apartment-booking:py${{ matrix.python-version }} --help

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install coverage

      - name: Run tests with coverage
        run: coverage run --source=apartment_booking -m unittest -v

      - name: Coverage report
        run: |
          coverage report -m
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Enforce minimum coverage
        run: coverage report --fail-under=90
